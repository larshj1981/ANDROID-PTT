name: Byg apps
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PTTRadio-android
          path: app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements.txt pyinstaller
      - run: >
          pyinstaller --onefile --noconsole --name PTTRadio
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          windows/pttradio_win.py
      - run: pyinstaller --onefile --console --name PTTHub hub/hub.py
      - name: Skærmbillede af interfacet
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          pip install pillow
          $env:PTT_SCREENSHOT = "$PWD\shot.png"
          python windows/pttradio_win.py
          foreach ($f in "shot.png","shot_menu.png") {
            if (Test-Path $f) { Write-Output "BEGIN-$f"; [Convert]::ToBase64String([IO.File]::ReadAllBytes($f)); Write-Output "END-$f" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PTTRadio-windows
          path: |
            dist/PTTRadio.exe
            dist/PTTHub.exe

  android-screenshot:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PTTRadio-android
      - name: Aktivér KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r app-debug.apk
            adb shell pm grant dk.pttradio android.permission.RECORD_AUDIO
            adb shell am start -n dk.pttradio/.MainActivity
            sleep 6
            adb exec-out screencap -p > off.png
            adb shell am start -S -n dk.pttradio/.MainActivity --ez demo true
            sleep 4
            adb exec-out screencap -p > on.png
            echo BEGIN-android_off.png; base64 -w 4000 off.png; echo END-android_off.png
            echo BEGIN-android_on.png; base64 -w 4000 on.png; echo END-android_on.png
